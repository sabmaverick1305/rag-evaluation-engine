[project]
name = "rag-evaluation-engine"
version = "0.1.0"
description = "Offline evaluation and hybrid RAG pipeline with Knowledge Graph augmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "langchain>=0.1.16",
    "langchain-core>=0.1.42",
    "sentence-transformers>=2.5.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.2.1",
    "langsmith>=0.1.0",
    "langchain-text-splitters>=1.1.3",
    "psycopg2>=2.9.13",
    "pypdf>=6.21.2",
    "langchain-huggingface>=1.2.3",
    "accelerate>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.4; sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
